# Netlify config for the whalehub.io marketing site.
# Deployed by the GitHub Action .github/workflows/deploy-website.yml, which runs
# `netlify deploy --prod --dir=website-redesign` — so this file is read from the
# deployed root (website-redesign/). No build step; static files only.

# Long-cache immutable assets (logos, 3D coins, blog covers).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML always revalidates so new blog posts / homepage edits appear immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/blog/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Correct content types for the crawl files.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"

# SEP-1 stellar.toml — wallets/explorers read the BLUB issuer's home_domain
# (whalehub.io) and fetch this file for the asset icon + verification. SEP-1
# requires text/plain and permissive CORS (Freighter fetches it client-side).
[[headers]]
  for = "/.well-known/stellar.toml"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"
