# Netlify config for the whalehub.io marketing site.
# Deployed by the GitHub Action .github/workflows/deploy-website.yml, which runs
# `netlify deploy --prod --dir=website-redesign` — so this file is read from the
# deployed root (website-redesign/). No build step; static files only.

# Legacy blog URLs from the previous site version lived under /blog-posts/ and are
# still indexed by Google (but now 404). 301 them to the new /blog/ so their crawl
# equity + any inbound links carry over. Map the one known article to its closest
# topical match; catch-all the rest to the blog index.
[[redirects]]
  from = "/blog-posts/unlocking-yield-in-the-crypto-space-a-guide-to-maximizing-returns"
  to = "/blog/stellar-yield-farming"
  status = 301
[[redirects]]
  from = "/blog-posts/*"
  to = "/blog/"
  status = 301

# Long-cache immutable assets (logos, 3D coins, blog covers).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# HTML always revalidates so new blog posts / homepage edits appear immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/blog/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Correct content types for the crawl files.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"

# SEP-1 stellar.toml — wallets/explorers read the BLUB issuer's home_domain
# (whalehub.io) and fetch this file for the asset icon + verification. SEP-1
# requires text/plain and permissive CORS (Freighter fetches it client-side).
[[headers]]
  for = "/.well-known/stellar.toml"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"
