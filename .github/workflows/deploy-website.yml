name: Deploy website (whalehub.io)

# Auto-deploys ONLY the marketing site. The path filter means app (src/),
# contracts, and docs changes never trigger a website deploy — and vice-versa.
on:
  push:
    branches: [main]
    paths:
      - 'website-redesign/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch: {}

# Never run two website deploys at once; cancel an in-flight one on a new push.
concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy website-redesign to Netlify (production)
        run: |
          npm install -g netlify-cli@17
          netlify deploy \
            --prod \
            --dir=website-redesign \
            --site="$NETLIFY_SITE_ID" \
            --message "website-redesign @ ${GITHUB_SHA::7}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_WEBSITE_SITE_ID }}
