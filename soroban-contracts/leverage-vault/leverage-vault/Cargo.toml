[package]
name = "whalehub-leverage-vault"
version = "0.1.0"
edition = "2021"
authors = ["WhaleHub Team"]
description = "WhaleHub Leveraged LP Farming Vault (Blend flash-loan leverage) for Soroban"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
