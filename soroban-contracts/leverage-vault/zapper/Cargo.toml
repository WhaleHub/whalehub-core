[package]
name = "whalehub-leverage-zapper"
version = "0.1.0"
edition = "2021"
authors = ["WhaleHub Team"]
description = "Flash-loan receiver/zapper for the WhaleHub leverage vault (separate contract to avoid Soroban re-entrancy)"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
