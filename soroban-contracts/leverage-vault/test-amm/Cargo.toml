[package]
name = "whalehub-test-amm"
version = "0.1.0"
edition = "2021"
authors = ["WhaleHub Team"]
description = "Minimal Aquarius-interface constant-product AMM (testnet LP collateral source)"

[lib]
crate-type = ["cdylib"]

[dependencies]
